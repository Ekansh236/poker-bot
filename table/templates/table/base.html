<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Poker{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse 90% 55% at 50% 12%, rgba(139,0,30,0.22), transparent 62%),
      radial-gradient(ellipse 130% 85% at 50% 100%, #2a0a10 0%, #0d0305 70%);
    background-color: #0a0305;
    color: #f0e6d2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: radial-gradient(ellipse at 50% 20%, #9a1f2e 0%, #731520 55%, #4a0c14 100%);
    border: 7px solid #141010;
    box-shadow: inset 0 0 0 2px #d4af6a, inset 0 0 40px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5);
    border-radius: 18px;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    text-align: center;
  }
  p.subtitle {
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
    margin: 0 0 8px;
  }
  label {
    font-size: 13px;
    opacity: 0.85;
  }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 11px 10px;
    border-radius: 7px;
    border: 1px solid rgba(212,175,106,0.4);
    background: rgba(10, 7, 4, 0.55);
    color: #f0e6d2;
    font-size: 15px;
    margin-top: 4px;
  }
  input:focus { outline: 2px solid #ffd54a; }
  button, .btn {
    display: block;
    width: 100%;
    background: rgba(10, 7, 4, 0.4);
    color: #f0e6d2;
    border: 1px solid rgba(212,175,106,0.4);
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover, .btn:hover { background: rgba(10, 7, 4, 0.6); transform: translateY(-1px); }
  button:active, .btn:active { transform: translateY(0) scale(0.98); }
  .btn-prominent {
    background: #ffd54a;
    color: #1a1a1a;
    border: none;
    font-weight: 700;
  }
  .btn-prominent:hover { background: #ffe07a; }
  .error {
    color: #ff8a8a;
    font-size: 13px;
    text-align: center;
    margin: 0;
  }
  .link-back {
    text-align: center;
    font-size: 13px;
    opacity: 0.7;
    margin-top: 6px;
  }
  .link-back a { color: #8fc9e8; }
  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
