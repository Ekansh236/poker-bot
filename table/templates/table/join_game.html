{% extends "table/base.html" %}
{% block title %}Join Game{% endblock %}
{% block content %}
<div class="card">
  <h1>Join Game</h1>
  <p class="subtitle">Enter the table code your friend sent you.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'join_game' %}">
    {% csrf_token %}
    <label for="table_id">Table code</label>
    <input type="text" id="table_id" name="table_id" value="{{ table_id }}" placeholder="e.g. a1b2c3d4" required {% if not table_id %}autofocus{% endif %}
           pattern="\w{1,20}" maxlength="20" title="Letters, numbers, and underscores only">

    <label for="player_id" style="display:block; margin-top: 14px;">Your name</label>
    <input type="text" id="player_id" name="player_id" placeholder="e.g. bob" required {% if table_id %}autofocus{% endif %}
           pattern="\w{1,20}" maxlength="20" title="Letters, numbers, and underscores only">

    <button type="submit" class="btn-prominent" style="margin-top: 20px;">Join Table</button>
  </form>
  <p class="link-back"><a href="{% url 'lobby' %}">&larr; back</a></p>
</div>
{% endblock %}
