services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POKER_DB_NAME:-pokerbot}
      POSTGRES_USER: ${POKER_DB_USER:-pokerbot}
      POSTGRES_PASSWORD: ${POKER_DB_PASSWORD:-pokerbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POKER_DB_USER:-pokerbot}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Builds once, every other service below reuses this same image (see the
  # Dockerfile's own note) -- `build` is repeated per service because
  # compose has no first-class "build this, run it four ways" primitive,
  # but Docker's layer cache means only the first build actually does work.
  web:
    build: .
    # Applying migrations is part of STARTING the web service, not a
    # separate manual step -- there's exactly one process that should ever
    # run them automatically on every boot, not four (worker/beat/flower
    # each racing to migrate too).
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: .env
    environment:
      POKER_DB_HOST: db
      POKER_REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    # No --pool=solo here -- that flag works around a macOS-specific
    # prefork-pool crash when running directly on the host (see README).
    # Linux containers don't hit it, so the worker gets real multiprocess
    # concurrency instead of being forced onto a single process.
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      POKER_DB_HOST: db
      POKER_REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    # Beat only ever schedules task messages onto Redis -- it never touches
    # Postgres itself (the worker does, when a scheduled task actually
    # runs), so it has no reason to wait on `db`.
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      POKER_REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A config flower --port=5555
    env_file: .env
    environment:
      POKER_REDIS_HOST: redis
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
