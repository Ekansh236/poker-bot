name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres + Redis, not mocks -- the same reasoning as this
    # project's own tests preferring live Redis/locking behavior over
    # stubs: a migration or connection-config bug should fail CI here,
    # not surface the first time someone actually runs docker-compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pokerbot
          POSTGRES_USER: pokerbot
          POSTGRES_PASSWORD: pokerbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokerbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POKER_SECRET_KEY: ci-only-not-a-real-secret
      POKER_DB_NAME: pokerbot
      POKER_DB_USER: pokerbot
      POKER_DB_PASSWORD: pokerbot
      POKER_DB_HOST: localhost
      POKER_DB_PORT: 5432
      POKER_REDIS_HOST: localhost
      POKER_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Fail if models and migrations have drifted apart
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run the test suite
        run: pytest -q
