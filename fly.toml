# Fly app config. `app` must be globally unique across all Fly accounts --
# if `ekansh-poker-bot` is taken, `fly launch`/`fly apps create` will ask
# for a different one; update this line to match whatever it actually
# creates.
app = "ekansh-poker-bot"
primary_region = "iad"

[build]

# bin/start-fly.sh runs Redis + the web app + the Celery worker + Celery
# Beat all on this one machine (see that script's own comment for why).
[processes]
  app = "bin/start-fly.sh"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # IMPORTANT: this app must stay pinned to exactly ONE running machine
  # (`fly scale count 1`) -- Fly's default "spin up a second machine for
  # zero-downtime deploys" behavior is actively WRONG here. Each machine
  # runs its own independent in-process Redis (bin/start-fly.sh); with 2
  # machines, a player and the bot that's supposed to be playing against
  # them can land on different machines with different, disconnected
  # game state. min_machines_running below does NOT prevent a second
  # machine from being created on deploy -- re-run `fly scale count 1`
  # if a deploy ever creates one.
  # A friend should be able to join without waiting through a cold start
  # -- unlike a typical stateless web app, this one keeps live game state
  # in the same machine's in-process Redis, so scaling to zero between
  # visits would silently wipe any hand in progress, not just add
  # latency.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
